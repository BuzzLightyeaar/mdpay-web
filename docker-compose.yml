services:
  postgres:
    image: postgres:16-alpine
    container_name: mdpay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mdpay
      POSTGRES_USER: mdpay
      POSTGRES_PASSWORD: mdpay_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mdpay_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdpay -d mdpay"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mdpay_db:
